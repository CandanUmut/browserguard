name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 pyinstaller pytest

      - name: Run tests
        run: python -m pytest tests -q

      - name: Build
        run: pyinstaller browserguard.spec --noconfirm

      - name: Check the build runs
        run: .\dist\browserguard-cli.exe --version

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/BrowserGuard.exe
            dist/browserguard-cli.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 pyinstaller pytest

      - name: Run tests
        run: python -m pytest tests -q

      - name: Build
        run: pyinstaller browserguard.spec --noconfirm

      - name: Check the build runs
        run: ./dist/browserguard-cli --version

      - name: Check the app bundle launches
        # Offscreen so it needs no display; it should start and exit cleanly.
        run: |
          BROWSERGUARD_DRY_RUN=1 QT_QPA_PLATFORM=offscreen \
            ./dist/BrowserGuard.app/Contents/MacOS/BrowserGuard --version

      - name: Package
        run: |
          cd dist
          zip -ry BrowserGuard-macOS.zip BrowserGuard.app browserguard-cli

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/BrowserGuard-macOS.zip

  release:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows/BrowserGuard.exe
            artifacts/windows/browserguard-cli.exe
            artifacts/macos/BrowserGuard-macOS.zip
          generate_release_notes: true
