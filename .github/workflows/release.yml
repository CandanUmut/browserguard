name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 pyinstaller pytest

      - name: Run tests
        run: python -m pytest tests -q

      - name: Build executables
        run: pyinstaller browserguard.spec --noconfirm

      - name: Check the build runs
        run: .\dist\browserguard-cli.exe --version

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: browserguard-windows
          path: |
            dist/BrowserGuard.exe
            dist/browserguard-cli.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/BrowserGuard.exe
            dist/browserguard-cli.exe
          generate_release_notes: true
